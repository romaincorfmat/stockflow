name: Deploy to Homelab
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, stockflow]

    steps:
      - name: Update Stockflow
        run: |
          cd /srv/homelab/apps/stockflow
          git pull --ff-only origin main

      - name: Rebuild API
        run: |
          cd /srv/homelab/apps/stockflow/backend
          docker compose up -d --build

      - name: Health Check
        run: |
          sleep 5
          curl --fail http://localhost:3000/api/health
